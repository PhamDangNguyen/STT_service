[project]
name = "stt-service"
version = "0.1.0"
description = "Speech-to-Text microservice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    # Config & validation
    "pydantic-settings>=2.7.0",
    # Database
    "motor>=3.7.0",
    "pymongo>=4.17.0",
    # HTTP client
    "httpx>=0.28.0",
    # Audio I/O
    "numpy>=2.0.0",
    "soundfile>=0.12.1",
    # Utilities
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    # LLM providers
    "openai>=1.82.0",
    "anthropic>=0.49.0",
    "transformers>=5.9.0",
    "requests>=2.34.2",
]

[project.optional-dependencies]
ml = [
    # Install separately with CUDA support:
    # uv pip install torch --index-url https://download.pytorch.org/whl/cu121
    "faster-whisper>=1.1.1",
    "pyannote.audio>=3.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
